<script>
const SB=supabase.createClient('https://wtvnrqpwruxwedlqhrwx.supabase.co','sb_publishable_8_l_iQYIVdOGmdcak9DaWQ_6Z9GcCer');
const storage=(b,p)=>'https://wtvnrqpwruxwedlqhrwx.supabase.co/storage/v1/object/public/'+b+'/'+String(p).split('/').map(encodeURIComponent).join('/');
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function yt(v){if(!v)return'';let t=String(v).trim(),m=t.match(/<iframe[^>]+src=["']([^"']+)["']/i);if(m)t=m[1];try{let u=new URL(t),h=u.hostname.replace(/^www\./,'');let list=u.searchParams.get('list');let id=u.searchParams.get('v');if(h==='youtu.be')id=u.pathname.slice(1);if(h.includes('youtube.com')&&u.pathname.startsWith('/shorts/'))id=u.pathname.split('/')[2];if(list)return 'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list)+'&rel=0&playsinline=1&origin='+encodeURIComponent(location.origin);if(id)return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0&playsinline=1&origin='+encodeURIComponent(location.origin);if(h.includes('youtube.com')&&u.pathname.startsWith('/embed/')){u.hostname='www.youtube-nocookie.com';u.searchParams.set('origin',location.origin);u.searchParams.set('playsinline','1');return u.toString()}}catch(e){}return''}
async function downloadProfileFile(url,filename){
  try{
    const response=await fetch(url);

if(!response.ok){
  throw new Error('파일을 불러오지 못했습니다.');
}

const originalBlob=await response.blob();

const downloadBlob=new Blob(
  [originalBlob],
  {type:'application/octet-stream'}
);

const blobUrl=URL.createObjectURL(downloadBlob);

const a=document.createElement('a');
a.href=blobUrl;
a.download=filename||'배우 최예찬 프로필.pdf';
a.style.display='none';

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>{
  URL.revokeObjectURL(blobUrl);
},3000);

}catch(e){
console.error(e);

const fallback=
  url+'?download='+
  encodeURIComponent(filename||'profile.pdf');

window.location.href=fallback;

}
}

function videoCard(v){let src=v.video_path?storage('actor-videos',v.video_path):'',em=yt(v.youtube_embed||v.youtube_url);let media=src?'<video controls playsinline preload="metadata" src="'+esc(src)+'"></video>'?'<iframe loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen src="'+esc(em)+'"></iframe>':'<div class="empty">영상을 준비 중입니다.</div>';let dl=src?'<a href="'+esc(src+'?download='+encodeURIComponent(v.video_name||v.title||'video'))+'">영상 다운로드</a>':'';return '<article class="card"><div class="video">'+media+'</div><div class="video-copy"><div class="video-title"><h3>'+esc(v.title||'영상')+'</h3>'+dl+'</div><p>'+esc(v.description||'')+'</p></div></article>'}
async function load(){try{const[{data,error},{data,error},{data,error}]=await Promise.all([SB.from('site_content').select('').eq('id',true).single(),SB.from('media_items').select('').order('section').order('sort_order').order('created_at'),SB.from('profile_documents').select('').order('sort_order').order('created_at')]);if(ce)throw ce;if(me)throw me;if(de)throw de;document.getElementById('name').textContent=c.name||'최예찬';document.getElementById('english').textContent=c.english_name||'CHOI YECHAN';document.getElementById('greeting').textContent=c.greeting||'안녕하세요.\n청춘예찬을 좋아하는 배우, 최예찬입니다.';document.getElementById('info').innerHTML='<div>'+esc(c.school||'')+'</div><div>'+esc(c.birth_year||'')+'년생 · '+esc(c.height_cm||'')+'cm · '+esc(c.weight_kg||'')+'kg</div><div>특기 · '+esc(c.specialty||'')+'</div>';document.getElementById('ig').href=c.instagram_url||'#';const phone=String(c.phone||'').trim(),email=String(c.email||'').trim(),phoneLink=document.getElementById('phoneLink'),emailLink=document.getElementById('emailLink');document.getElementById('phoneText').textContent=phone||'전화번호를 준비 중입니다.';document.getElementById('emailText').textContent=email||'이메일을 준비 중입니다.';if(phone){phoneLink.href='tel:'+phone.replace(/[^0-9+]/g,'');}else{phoneLink.removeAttribute('href')}if(email){emailLink.href='mailto:'+email;}else{emailLink.removeAttribute('href')}
const p=m.filter(x=>x.section==='profile'&&x.image_path),track=document.getElementById('photos'),dots=document.getElementById('dots'),prev=document.getElementById('photoPrev'),next=document.getElementById('photoNext'),counter=document.getElementById('photoCounter'),nav=document.getElementById('photoNav');
const photos=p.length?p:[{image_path:''}];
photos.forEach((x,i)=>{let s=document.createElement('div');s.className='slide';s.innerHTML=x.image_path?'<img src="'+esc(storage('profile-media',x.image_path))+'" alt="최예찬 프로필 사진 '+(i+1)+'">':'<div class="placeholder"><div><strong>PROFILE PHOTO</strong>관리자에서 사진을 추가해주세요.</div></div>';track.appendChild(s);let dot=document.createElement('button');dot.type='button';dot.className='dot'+(i?'':' active');dot.setAttribute('aria-label','프로필 사진 '+(i+1));dot.addEventListener('click',()=>go(i));dots.appendChild(dot)});
function currentIndex(){return Math.max(0,Math.min(photos.length-1,Math.round(track.scrollLeft/Math.max(track.clientWidth,1))))}
function update(i){[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===i));counter.textContent=(i+1)+' / '+photos.length;prev.disabled=i===0;next.disabled=i===photos.length-1;nav.style.display=photos.length>1?'flex':'none';dots.style.display=photos.length>1?'flex':'none';counter.style.display=photos.length>1?'block':'none'}
function go(i){i=Math.max(0,Math.min(photos.length-1,i));track.scrollTo({lefttrack.clientWidth,behavior:'smooth'});update(i)}
prev.addEventListener('click',()=>go(currentIndex()-1));next.addEventListener('click',()=>go(currentIndex()+1));
let scrollTimer;track.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>update(currentIndex()),60)});window.addEventListener('resize',()=>update(currentIndex()));update(0);
for(const[id,sec,label] of [['intro','intro','자기소개 영상을 준비 중입니다.'],['free','free_acting','자유연기 영상을 준비 중입니다.'],['works','works','출연영상을 준비 중입니다.']]){let arr=m.filter(x=>x.section===sec),box=document.getElementById(id);box.innerHTML=arr.length?arr.map(videoCard).join(''):'<div class="card"><div class="video"><div class="empty">'+label+'</div></div></div>'}
let box=document.getElementById('docs');

box.innerHTML=d.length
?d.map(x=>{
let u=storage('profile-documents',x.storage_path);

return '<div class="file-row">'+
  '<div>'+
    '<strong>'+esc(x.title)+'</strong>'+
    '<small>'+esc(x.document_type.toUpperCase())+' 파일</small>'+
  '</div>'+
  '<div class="actions">'+
    '<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">보기</a>'+
    '<a class="btn download-profile" href="'+esc(u)+'">다운로드</a>'+
  '</div>'+
'</div>';

}).join('')
:'<div class="file-row">프로필 파일을 준비 중입니다.</div>';

document.querySelectorAll('.download-profile').forEach((btn,i)=>{
btn.addEventListener('click',async e=>{
e.preventDefault();

const item=d[i];
if(!item) return;

const url=storage('profile-documents',item.storage_path);
const filename=item.title||'배우 최예찬 프로필.pdf';

await downloadProfileFile(url,filename);

});
});
}catch(e){console.error(e);document.getElementById('greeting').textContent='프로필을 불러오는 중 문제가 발생했습니다.'}}load();
</script></body></html>
