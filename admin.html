<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>최예찬 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff3ff,#f7fcff);color:#163444;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}main{width:min(900px,calc(100% - 28px));margin:28px auto 60px}.card{background:#fff;border:1px solid #dcecf2;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 10px 30px rgba(24,76,104,.07)}h1{margin:0 0 5px;font-size:28px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px}label{display:block;font-size:12px;color:#607985;margin:12px 0}input,textarea,select{width:100%;margin-top:6px;padding:11px;border:1px solid #cfe1e9;border-radius:11px;font:inherit;background:#fff}textarea{min-height:82px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:99px;padding:10px 14px;background:#123b52;color:#fff;cursor:pointer}.secondary{background:#eef8fc;color:#31586a;border:1px solid #cfe2ea}.danger{background:#fff0f0;color:#8a4040}.item{border:1px solid #dcecf2;border-radius:14px;padding:13px;margin:10px 0}.head{display:flex;justify-content:space-between;align-items:center}.status{font-size:12px;color:#607985;line-height:1.65;white-space:pre-line}.login{max-width:420px;margin:12vh auto}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.head{display:block}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main id="root" class="login card"><h1>YECHAN ADMIN</h1><p class="status">관리자 로그인</p><label>이메일<input id="email" type="email"></label><label>비밀번호<input id="password" type="password"></label><div class="row"><button class="btn" id="login">로그인</button></div><p id="loginStatus" class="status"></p></main><main id="app" class="hidden"><div class="head"><div><h1>YECHAN ADMIN</h1><p class="status">저장하면 공개 사이트에 즉시 반영됩니다.</p></div><div class="row"><a class="btn secondary" href="./" target="_blank">공개 사이트</a><button class="btn secondary" id="logout">로그아웃</button></div></div><section class="card"><h2>기본 프로필</h2><div class="grid"><div><label>이름<input id="name"></label></div><div><label>영문 이름<input id="english_name"></label></div><div><label>학교<input id="school"></label></div><div><label>출생연도<input id="birth_year" type="number"></label></div><div><label>키<input id="height_cm" type="number"></label></div><div><label>몸무게<input id="weight_kg" type="number"></label></div><div><label>특기<input id="specialty"></label></div><div><label>전화번호<input id="phone"></label></div><div><label>이메일<input id="site_email" type="email"></label></div><div><label>Instagram URL<input id="instagram_url"></label></div></div><label>소개 문구<textarea id="greeting"></textarea></label><button class="btn" id="saveProfile">프로필 저장</button></section><section class="card"><div class="head"><h2>프로필 사진</h2><button class="btn secondary" id="addPhoto">+ 사진 추가</button></div><div id="photos"></div></section><section class="card"><div class="head"><h2>자기소개 영상</h2><button class="btn secondary" id="addIntro">+ 추가</button></div><div id="introList"></div></section><section class="card"><div class="head"><h2>자유연기</h2><button class="btn secondary" id="addFree">+ 추가</button></div><div id="freeList"></div></section><section class="card"><div class="head"><h2>출연영상</h2><button class="btn secondary" id="addWorks">+ 추가</button></div><div id="worksList"></div></section><section class="card"><h2>프로필 PDF / PPT</h2><div class="grid"><label>파일 제목<input id="docTitle" placeholder="예: 최예찬 배우 프로필"></label><label>파일 선택<input id="docFile" type="file" accept=".pdf,.ppt,.pptx"></label></div><button class="btn" id="addDoc">파일 업로드</button><div id="docs"></div></section><div id="status" class="status"></div></main>
<script>
const U='https://wtvnrqpwruxwedlqhrwx.supabase.co',K='sb_publishable_8_l_iQYIVdOGmdcak9DaWQ_6Z9GcCer',SB=supabase.createClient(U,K),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let token='',site={},media=[],docs=[];
async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function upload(bucket,file){
  const ext=(file.name.split('.').pop()||'bin')
    .toLowerCase()
    .replace(/[^a-z0-9]/g,'');

  const path='admin/'+crypto.randomUUID()+'.'+(ext||'bin');
  const r=await fetch(U+'/storage/v1/object/'+bucket+'/'+path,{
    method:'POST',
    headers:{
      apikey:K,
      Authorization:'Bearer '+token,
      'Content-Type':file.type||'application/octet-stream',
      'x-upsert':'false'
    },
    body:file
  });

  if(!r.ok)throw Error(await r.text());

  return path;
}
async function load(){[site]=await api('site_content?select=*&id=eq.true');media=await api('media_items?select=*&order=section.asc,sort_order.asc,created_at.asc');docs=await api('profile_documents?select=*&order=sort_order.asc,created_at.asc');for(const k of ['name','english_name','school','birth_year','height_cm','weight_kg','specialty','phone','instagram_url','greeting'])$(k).value=site[k]??'';$('site_email').value=site.email||'';renderAll()}
function renderAll(){renderPhotos();renderDocs();for(const [id,sec] of [['introList','intro'],['freeList','free_acting'],['worksList','works']]){const box=$(id);box.innerHTML='';media.filter(x=>x.section===sec).forEach((m,i)=>{const d=document.createElement('div');d.className='item';d.dataset.id=m.id;d.innerHTML='<div class="head"><strong>'+(esc(m.title||'영상'))+'</strong><button class="btn danger del">삭제</button></div><label>제목<input class="title" value="'+esc(m.title)+'"></label><label>설명<input class="desc" value="'+esc(m.description||'')+'"></label><label>YouTube URL 또는 퍼가기 iframe<textarea class="embed">'+esc(m.youtube_embed||m.youtube_url||'')+'</textarea></label><label>직접 영상 파일 (선택)<input class="video" type="file" accept="video/*"></label><div class="status">'+(m.video_name?'현재 파일: '+esc(m.video_name):'YouTube 또는 파일 중 하나를 사용할 수 있습니다.')+'</div><button class="btn" data-save>이 영상 저장</button>';d.querySelector('.del').onclick=async()=>{await api('media_items?id=eq.'+m.id,{method:'DELETE'});await load()};d.querySelector('[data-save]').onclick=async()=>{try{$('status').textContent='영상 저장 중...';const val={title:d.querySelector('.title').value,description:d.querySelector('.desc').value,youtube_embed:d.querySelector('.embed').value,sort_order:i};const f=d.querySelector('.video').files[0];if(f){val.video_path=await upload('actor-videos',f);val.video_name=f.name}await api('media_items?id=eq.'+m.id,{method:'PATCH',body:JSON.stringify(val)});await load();$('status').textContent='영상 저장 완료'}catch(e){$('status').textContent=e.message}};box.appendChild(d)})}}
function renderDocs(){
  const box=$('docs');
  box.innerHTML='';

  if(!docs.length){
    box.innerHTML='<div class="status">등록된 프로필 파일이 없습니다.</div>';
    return;
  }

  docs.forEach((x,i)=>{
    const d=document.createElement('div');

    d.className='item';

    d.innerHTML=
      '<div class="head">'+
        '<strong>'+
          esc(x.title||('프로필 파일 '+(i+1)))+
        '</strong>'+
        '<button class="btn danger delDoc">삭제</button>'+
      '</div>'+
      '<div class="status">'+
        esc((x.document_type||'file').toUpperCase())+
        ' 파일'+
      '</div>'+
      '<div class="status">'+
        '현재 파일: '+
        esc(x.storage_path||'')+
      '</div>';

    d.querySelector('.delDoc').onclick=async()=>{
      if(!confirm('이 프로필 파일을 삭제할까요?')){
        return;
      }

      try{
        $('status').textContent='프로필 파일 삭제 중...';

        if(x.storage_path){
          const {error:se}=await SB.storage
            .from('profile-documents')
            .remove([x.storage_path]);

          if(se){
            throw se;
          }
        }

        await api(
          'profile_documents?id=eq.'+x.id,
          {method:'DELETE'}
        );

        await load();

        $('status').textContent='프로필 파일 삭제 완료';

      }catch(e){
        console.error(e);

        $('status').textContent=
          '파일 삭제 실패: '+e.message;
      }
    };

    box.appendChild(d);
  });
}
function renderPhotos(){const box=$('photos');box.innerHTML='';media.filter(x=>x.section==='profile').forEach((m,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div class="head"><strong>사진 '+(i+1)+'</strong><button class="btn danger del">삭제</button></div><img style="width:95px;height:120px;object-fit:cover;border-radius:9px;margin:8px 0" src="'+U+'/storage/v1/object/public/profile-media/'+m.image_path.split('/').map(encodeURIComponent).join('/')+'"><div class="row"><input class="order" style="width:90px" type="number" value="'+(m.sort_order||0)+'"><button class="btn secondary orderbtn">순서 저장</button><input class="pf" type="file" accept="image/*"></div>';d.querySelector('.del').onclick=async()=>{await api('media_items?id=eq.'+m.id,{method:'DELETE'});await load()};d.querySelector('.orderbtn').onclick=async()=>{await api('media_items?id=eq.'+m.id,{method:'PATCH',body:JSON.stringify({sort_order:+d.querySelector('.order').value||0})});await load()};d.querySelector('.pf').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const p=await upload('profile-media',f);await api('media_items?id=eq.'+m.id,{method:'PATCH',body:JSON.stringify({image_path:p})});await load()}catch(er){$('status').textContent=er.message}};box.appendChild(d)});if(!box.children.length)box.innerHTML='<div class="status">사진이 없습니다.</div>'}
async function addMedia(section,title){
  try{
    const count =
      media.filter(x => x.section === section).length + 1;

    let finalTitle = title;

    if(section === 'free_acting'){
      finalTitle =
        '자유연기 ' +
        String(count).padStart(2,'0');
    }

    if(section === 'works'){
      finalTitle =
        '출연영상 ' +
        String(count).padStart(2,'0');
    }

    if(section === 'intro'){
      finalTitle = '자기소개 영상';
    }

    await api(
      'media_items',
      {
        method:'POST',
        headers:{
          Prefer:'return=representation'
        },
        body:JSON.stringify({
          section:section,
          title:finalTitle,
          description:'',
          youtube_embed:'',
          youtube_url:'',
          sort_order:count - 1
        })
      }
    );

    await load();

    $('status').textContent =
      finalTitle + '이(가) 추가되었습니다.';

  }catch(e){

    console.error(e);

    $('status').textContent =
      '영상 추가 실패: ' + e.message;
  }
}
$('addPhoto').onclick=()=>{
  const f=document.createElement('input');

  f.type='file';
  f.accept='image/*';
  f.multiple=true;

  f.onchange=async()=>{
    const files=[...f.files];

    if(!files.length)return;

    try{
      $('status').textContent=files.length+'장 업로드 중...';

      const startOrder=media.filter(
        x=>x.section==='profile'
      ).length;

      for(let i=0;i<files.length;i++){
        const file=files[i];

        const path=await upload(
          'profile-media',
          file
        );

        await api(
          'media_items',
          {
            method:'POST',
            headers:{
              Prefer:'return=representation'
            },
            body:JSON.stringify({
              section:'profile',
              title:'프로필 사진',
              image_path:path,
              sort_order:startOrder+i
            })
          }
        );
      }

      await load();

      $('status').textContent=
        files.length+'장의 사진이 추가되었습니다.';

    }catch(e){

      console.error(e);

      $('status').textContent=
        '사진 업로드 실패: '+e.message;
    }
  };

  f.click();
};
$('addIntro').onclick=()=>{
  addMedia(
    'intro',
    '자기소개 영상'
  );
};

$('addFree').onclick=()=>{
  addMedia(
    'free_acting',
    '자유연기'
  );
};

$('addWorks').onclick=()=>{
  addMedia(
    'works',
    '출연영상'
  );
};
$('saveProfile').onclick=async()=>{try{const p={name:$('name').value,english_name:$('english_name').value,greeting:$('greeting').value,school:$('school').value,birth_year:+$('birth_year').value||null,height_cm:+$('height_cm').value||null,weight_kg:+$('weight_kg').value||null,specialty:$('specialty').value,phone:$('phone').value,email:$('site_email').value,instagram_url:$('instagram_url').value};await api('site_content?id=eq.true',{method:'PATCH',body:JSON.stringify(p)});$('status').textContent='프로필 저장 완료'}catch(e){$('status').textContent=e.message}};
$('addDoc').onclick=async()=>{try{const f=$('docFile').files[0];if(!f)return;const ext=(f.name.split('.').pop()||'').toLowerCase();if(!['pdf','ppt','pptx'].includes(ext))throw Error('PDF/PPT/PPTX만 업로드할 수 있습니다.');if(f.size>50*1024*1024)throw Error('이 파일은 50MB를 초과합니다. Free 플랜에서는 한 파일 최대 50MB입니다.');const p=await upload('profile-documents',f);await api('profile_documents',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({document_type:ext==='pdf'?'pdf':'ppt',title:$('docTitle').value||f.name,storage_path:p,sort_order:docs.length})});await load();$('status').textContent='프로필 파일 업로드 완료'}catch(e){$('status').textContent=e.message}};
$('login').onclick=async()=>{try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'로그인 실패');token=j.access_token;$('root').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginStatus').textContent=e.message}};
$('logout').onclick=()=>location.reload();
</script></body></html>
